        * { margin: 0; padding: 0; box-sizing: border-box; }

            min-height: 100vh;

            display: flex;

        }
        main { padding: 2rem 1.25rem; }
        .err { color: var(--sor); margin-bottom: 2rem; }
        a { color: var(--muted); text-underline-offset: 4px; }
        a:hover { color: var(--sor); }
        :focus-visible { outline: 2px solid var(--sor); outline-offset: 3px; }
    </style>
